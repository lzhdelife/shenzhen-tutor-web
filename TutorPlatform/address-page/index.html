<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家教单平台最新地址</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #dde3ea;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 10px 0; color: var(--muted); line-height: 1.7; }
    .url {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      word-break: break-all;
    }
    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .small { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>家教单平台最新地址</h1>
    <p>老师和中介可以收藏这个页面。管理员更新最新地址后，从这里进入家教单平台。</p>
    <div id="url" class="url">正在读取最新地址...</div>
    <a id="open" class="button" href="#" aria-disabled="true">打开家教单平台</a>
    <p id="time" class="small"></p>
    <p class="small">说明：免费临时公网地址会变化；固定发布页不变，但需要管理员把最新地址同步到这个页面使用的 `latest-url.json`。</p>
  </main>
  <script>
    async function boot() {
      try {
        const res = await fetch('./latest-url.json?ts=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        if (!data.url) throw new Error('empty url');
        document.getElementById('url').textContent = data.url;
        document.getElementById('open').href = data.url;
        document.getElementById('open').removeAttribute('aria-disabled');
        document.getElementById('time').textContent = data.updatedAt ? '更新时间：' + data.updatedAt : '';
      } catch (err) {
        document.getElementById('url').textContent = '暂时没有读取到最新地址，请联系管理员。';
      }
    }
    boot();
  </script>
</body>
</html>
